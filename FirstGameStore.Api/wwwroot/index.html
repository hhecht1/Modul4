<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Game Store</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="list-page">
  <div class="page-header">
    <a class="btn btn-create" href="create.html">+ Neues Spiel erstellen</a>
    <h1>🎮 Game Store</h1>
  </div>

  <div id="message"></div>

  <div class="filters-panel">
    <div class="filters-row">
      <div class="filter-group">
        <label for="searchInput">Suche nach Spielname</label>
        <input type="text" id="searchInput" placeholder="z.B. Zelda, Witcher, Minecraft" />
      </div>

      <div class="filter-group">
        <label for="genreFilter">Nach Genre filtern</label>
        <select id="genreFilter">
          <option value="">Alle Genres</option>
        </select>
      </div>

      <div class="filter-group">
        <label for="sortFilter">Sortieren nach</label>
        <select id="sortFilter">
          <option value="name-asc">Name (A-Z)</option>
          <option value="price-asc">Preis (günstig zuerst)</option>
          <option value="price-desc">Preis (teuer zuerst)</option>
          <option value="date-desc">Erscheinungsdatum (neu zuerst)</option>
          <option value="date-asc">Erscheinungsdatum (alt zuerst)</option>
        </select>
      </div>
    </div>
  </div>

  <div class="games-panel">
    <div id="gamesGrid" class="games-grid">
      <div class="empty-state">
        <span class="empty-state-title">🎮 Lade Spiele...</span>
        <div class="empty-state-text">Bitte einen Moment warten.</div>
      </div>
    </div>
  </div>

  <script src="js/common.js"></script>
  <script src="js/index.js"></script>
</body>
</html>
