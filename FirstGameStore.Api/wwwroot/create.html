<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spiel erstellen – Game Store</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="form-page">
  <div class="content-panel">
    <h1>🎮 Neues Spiel erstellen</h1>

    <form id="createForm">
      <label for="name">Name</label>
      <input type="text" id="name" placeholder="z.B. The Legend of Zelda" required />

      <label for="genre">Genre</label>
      <select id="genre" required></select>

      <label for="price">Preis (€)</label>
      <input type="number" id="price" step="0.01" min="0" placeholder="z.B. 49.90" required />

      <label for="releaseDate">Erscheinungsdatum</label>
      <input type="date" id="releaseDate" required />

      <div class="actions">
        <button type="submit" class="btn btn-submit">Spiel speichern</button>
        <a href="index.html" class="btn btn-back">Zurück</a>
      </div>
    </form>

    <div id="message"></div>
  </div>

  <script src="js/common.js"></script>
  <script src="js/create.js"></script>
</body>
</html>
