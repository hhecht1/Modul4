<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spiel bearbeiten – Game Store</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="form-page">
  <div class="content-panel">
    <h1>✏️ Spiel bearbeiten</h1>

    <form id="editForm">
      <label for="name">Name</label>
      <input type="text" id="name" required />

      <label for="genre">Genre</label>
      <select id="genre" required></select>

      <label for="price">Preis (€)</label>
      <input type="number" id="price" step="0.01" min="0" required />

      <label for="releaseDate">Erscheinungsdatum</label>
      <input type="date" id="releaseDate" required />

      <div class="actions">
        <button type="submit" class="btn btn-submit">Änderungen speichern</button>
        <a href="index.html" class="btn btn-back">Zurück</a>
      </div>
    </form>

    <div id="message"></div>
  </div>

  <script src="js/common.js"></script>
  <script src="js/edit.js"></script>
</body>
</html>
